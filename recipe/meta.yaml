{% set name = "validate_email" %}
{% set version = "1.3" %}
{% set sha256 = "784719dc5f780be319cdd185dc85dd93afebdb6ebb943811bc4c7c5f9c72aeaf" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  skip: True # [not linux64]
  number: 3
  script: {{ PYTHON }} -m pip install --no-deps --ignore-installed . --no-build-isolation

requirements:
  host:
    - pip
    - python
    - setuptools
    - wheel
  run:
    - python

test:
  imports:
    - validate_email
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/syrusakbary/validate_email
  license: LGPL-3.0-or-later
  license_family: GPL
  license_file: LICENSE
  description: 'Validate_email is a package for Python that check if an email is valid, properly formatted and really exists.'
  summary: 'Validate_email is a package for Python that check if an email is valid, properly formatted and really exists.'
  dev_url: https://github.com/syrusakbary/validate_email
  doc_url: https://github.com/syrusakbary/validate_email


extra:
  skip-lints:
    - host_section_needs_exact_pinnings
    - avoid_noarch
  anaconda-services:
    ref: https://anaconda.zendesk.com/agent/tickets/66289
    reason: Needed for flex-swagger prance=>flex-swagger
    recipe-maintainers:
       - bkreider

  recipe-maintainers:
    - nikicc
    - mariusvniekerk
    - xylar
